name: Flutter iOS Simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native projects
        run: flutter create --platforms=ios,android --org com.anoopx5 --project-name trivia_travel_app .

      - name: Keep generated platform projects in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios android
          if ! git diff --cached --quiet; then
            git commit -m "build: add generated Flutter iOS and Android projects"
            git push
          fi

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build unsigned iOS Simulator app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: trivia-travel-ios-simulator
          path: build/ios/iphonesimulator/Runner.app/
          if-no-files-found: error
          retention-days: 7
